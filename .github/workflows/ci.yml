name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The matrix is the point. This project's stated top risk is the install and
  # hardware-detection matrix, so the probe has to be exercised on all three
  # operating systems on every push. None of these runners have a GPU, which is
  # exactly why the vendor parsers are fixture-driven.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # Install into a virtualenv, never with `uv pip install --system`. The
      # system interpreter on the Linux and macOS runners is PEP 668
      # externally-managed, so `--system` is refused outright — and because
      # `--system` ignores whichever interpreter `uv python install` provided,
      # every matrix entry was silently testing the same Python anyway.
      #
      # Putting the venv on GITHUB_PATH means python, pytest, ruff, mypy and
      # bloomery all resolve to it in later steps without per-OS activation.
      - name: create venv on python ${{ matrix.python }}
        shell: bash
        run: |
          uv venv --python ${{ matrix.python }}
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: install
        run: uv pip install --torch-backend=auto -e ".[dev,train]"

      # Assert the interpreter and the training stack directly. This replaces an
      # earlier trick of failing the build whenever pytest reported any skip,
      # which conflated "torch is missing" with a legitimate platform skip.
      - name: verify the environment
        shell: bash
        run: |
          python -c "import sys; print('python', sys.version)"
          python -c "import torch, transformers; print('torch', torch.__version__, '| transformers', transformers.__version__)"
          python -c "import sys; assert sys.version_info[:2] == tuple(int(p) for p in '${{ matrix.python }}'.split('.')), sys.version_info"

      - name: test
        run: pytest -q

      # A real invocation on a real machine. Exit 1 is legitimate — it means an
      # error-level issue such as low disk was found — so only a crash fails
      # this step.
      - name: doctor runs
        shell: bash
        run: |
          doctor_status=0
          bloomery doctor || doctor_status=$?
          if [ "$doctor_status" -gt 1 ]; then
            echo "::error::doctor crashed with status $doctor_status"
            exit 1
          fi

      - name: doctor emits valid json
        shell: bash
        run: |
          bloomery doctor --json > report.json || true
          python - <<'PY'
          import json
          with open("report.json") as handle:
              report = json.load(handle)
          assert report["probe"]["host"]["platform"] in (
              "linux", "wsl2", "windows", "macos", "unknown"
          ), report["probe"]["host"]["platform"]
          assert len(report["capability"]["models"]) == 24, len(report["capability"]["models"])
          print("ok:", report["probe"]["host"]["platform"], report["probe"]["backend"])
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: create venv
        run: |
          uv venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The train extra is needed here too: mypy resolves numpy's bundled stubs,
      # and dropping it would turn a type error into an unanalysable import.
      - run: uv pip install --torch-backend=auto -e ".[dev,train]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy src

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9

      - name: build wheel and sdist
        run: uv build

      # Guards the licence metadata. Worth a check because PEP 639 support is
      # recent enough in the build backend to regress quietly, and shipping a
      # wheel with no licence recorded would be a real problem.
      #
      # The licence file location is deliberately not pinned: hatchling moved it
      # from `<dist-info>/LICENSE` to the PEP 639 standard
      # `<dist-info>/licenses/LICENSE`, and a build backend is entitled to use
      # either. What matters is that a licence file ships at all.
      - name: verify licence metadata
        run: |
          uv run --no-project python - <<'PY'
          import pathlib
          import zipfile

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          archive = zipfile.ZipFile(wheel)
          names = archive.namelist()

          metadata_name = next(n for n in names if n.endswith(".dist-info/METADATA"))
          metadata = archive.read(metadata_name).decode()
          assert "License-Expression: AGPL-3.0-or-later" in metadata, metadata

          licences = [
              n for n in names
              if ".dist-info/" in n and pathlib.PurePosixPath(n).name == "LICENSE"
          ]
          assert licences, f"no LICENSE shipped in the wheel: {names}"

          print(f"licence metadata ok: {wheel.name} -> {licences[0]}")
          PY
