[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bloomery"
version = "0.0.0"
description = "Train a language model from nothing, on your own machine."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aswin Alexander Sam", email = "aswinsam@gmail.com" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "llm",
    "pretraining",
    "fine-tuning",
    "training",
    "local",
    "gguf",
    "rocm",
    "cuda",
]
# No license classifier: PEP 639 deprecates them in favour of the SPDX
# expression in `license` above.
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Kept deliberately light so the placeholder release installs fast.
# Anything torch-shaped belongs in an extra, never here.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Torch itself is resolved by `uv pip install --torch-backend=auto`, which
# detects CUDA / ROCm / XPU / CPU and picks the matching wheel. These extras
# carry the framework layer that sits on top of whichever build got selected.
# Pretraining from scratch. Kept minimal — this is the install a first-time user
# pays for, and nothing here is optional to that path.
train = [
    "torch>=2.6",
    "transformers>=4.44",
    "tokenizers>=0.20",
    "safetensors>=0.4",
    "numpy>=1.26",
]
# Adapting an existing model: LoRA, QLoRA, preference optimization. Heavier, and
# not needed to train your first model, so it is a separate opt-in.
adapt = [
    "accelerate>=0.34",
    "peft>=0.13",
    "trl>=0.11",
    "datasets>=3.0",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "websockets>=13.0",
]
# Quantized training. CUDA and ROCm only — no macOS wheels exist.
quant = [
    "bitsandbytes>=0.44; sys_platform != 'darwin'",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-psutil",
    # Required by fastapi's TestClient. Declared here rather than in `serve`
    # because running the server does not need it, only testing it does.
    "httpx>=0.27",
]

[project.scripts]
bloomery = "bloomery.cli:main"

[project.urls]
Homepage = "https://github.com/finsicle/bloomery"
Repository = "https://github.com/finsicle/bloomery"
Issues = "https://github.com/finsicle/bloomery/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/bloomery"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are verbatim captures of vendor tool output. Rewrapping them to
# fit a line limit would stop them being faithful samples.
"tests/*" = ["E501"]
# typer declares CLI options as argument defaults; that is the framework's
# documented idiom, not the mutable-default bug B008 exists to catch.
"src/bloomery/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Deliberately not pinned to 3.11. numpy's bundled stubs use `type` statements,
# which mypy only accepts when told it is checking 3.12 or newer — so pinning to
# our minimum runtime version makes numpy itself unanalysable. Runtime support
# for 3.11 is verified by the CI test matrix instead.
warn_unused_ignores = true
warn_redundant_casts = true

# Optional extras and untyped third parties. torch and transformers are legitimately
# absent when the core package alone is installed; the probe guards those imports at
# runtime. tokenizers ships no py.typed marker.
[[tool.mypy.overrides]]
module = [
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "tokenizers",
    "tokenizers.*",
]
ignore_missing_imports = true
